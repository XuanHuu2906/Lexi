spring:
  config:
    activate:
      on-profile: test

  jpa:
    show-sql: true

    properties:
      hibernate:
        format_sql: true

lexi:
  security:
    jwt-secret: test-secret-only
    access-token-ttl: 15m
    refresh-token-days: 30

  cors:
    allowed-origins:
      - http://localhost:5173

  database:
    url: jdbc:postgresql://localhost:5432/lexi_test