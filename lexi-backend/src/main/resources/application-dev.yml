spring:
  config:
    activate:
      on-profile: dev

lexi:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-for-lexi-hs256-at-least-32-bytes}
    access-token-ttl: ${JWT_ACCESS_EXPIRES:15m}
    refresh-token-days: ${JWT_REFRESH_EXPIRES_DAYS:30}

  cors:
    allowed-origins:
      - http://localhost:3001

  database:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lexi}